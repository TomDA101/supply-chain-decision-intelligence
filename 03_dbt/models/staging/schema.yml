version: 2

models:
  - name: stg_order_list
    description: "One row per order, renamed and cast from the raw OrderList table."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: plant_code
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_freight_rates
    description: "Freight rate brackets per carrier/lane/service level, deduplicated in Pandas cleaning."
    columns:
      - name: carrier
        tests:
          - not_null
      - name: origin_port
        tests:
          - not_null
      - name: destination_port
        tests:
          - not_null

  - name: stg_plant_ports
    description: "Allowed plant-to-port links."
    columns:
      - name: plant_code
        tests:
          - not_null

  - name: stg_products_per_plant
    description: "Supported plant-product combinations."
    columns:
      - name: plant_code
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_vmi_customers
    description: "Vendor-managed inventory: plant-to-customer restrictions."
    columns:
      - name: plant_code
        tests:
          - not_null

  - name: stg_wh_capacities
    description: "Current-state daily order capacity per plant."
    columns:
      - name: plant_code
        tests:
          - unique
          - not_null

  - name: stg_wh_costs
    description: "Cost per unit per warehouse/plant."
    columns:
      - name: plant_code
        tests:
          - unique
          - not_null