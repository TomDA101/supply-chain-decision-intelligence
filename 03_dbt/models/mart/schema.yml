# models/mart/schema.yml
version: 2

models:
  - name: mart_customer_apindex
    description: "Customer-level Action Priority Index base table. Contains normalized (0-1) KPI inputs for Freight Cost Exposure, Capacity Risk, and Delivery Reliability, alongside raw values, plant dependency, and data-completeness flags. Weighting into a single composite score is applied in Tableau, not here."
    columns:
      - name: customer
        tests:
          - unique
          - not_null

      - name: freight_cost_exposure_norm
        description: "Log-transformed, min-max normalized weighted average freight rate (0-1). Null if customer has no non-CRF/non-gap orders."

      - name: capacity_risk_norm
        description: "Log-transformed, min-max normalized average plant capacity utilization (0-1). 26 of 46 customers share the max value due to PLANT03 dominance (~93% of order volume) — a genuine structural tie, not a scaling artifact."

      - name: delivery_risk_norm
        description: "Min-max normalized share of late deliveries (0-1). No transformation needed; already bounded [0,1] before scaling."

      - name: is_single_plant_exposed
        description: "True if 100% of the customer's orders route through a single plant."
        tests:
          - not_null

      - name: has_complete_kpi_data
        description: "False if any of the three KPI dimensions is null for this customer (see missing_kpi_dimensions). Used for the operational-view data-gap breakout; tactical/strategic views filter to true only."
        tests:
          - not_null

      - name: has_ambiguous_freight_data
        description: "Data-quality warning: TRUE if any of the customer's matched FreightRates rows show a >10x price spread for the same order — signals rate ambiguity, independent of the APIndex itself."   

  - name: mart_plant_overview
    description: "Plant-level overview for capacity, cost, and network visualizations. Separate grain from mart_customer_apindex (one row per plant, not per customer) — relate the two in Tableau via dashboard action filters, not a data-model join, to avoid fan-out."
    columns:
      - name: plant_code
        tests:
          - unique
          - not_null

  - name: mart_reallocation_opportunities
    description: >
      Customer-product-port level model for identifying structurally eligible
      plant reallocation opportunities. Reallocation candidates must support
      the same product and origin-port network as the current plant.
      Capacity metrics provide comparative context and do not represent
      confirmed physical spare capacity.

    columns:
      - name: customer
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: origin_port
        tests:
          - not_null

      - name: current_plant
        tests:
          - not_null

      - name: alternative_plant
        description: >
          Alternative plant that supports the same product and is connected
          to the same origin port as the current plant.
        tests:
          - not_null

      - name: order_count
        tests:
          - not_null

      - name: current_daily_capacity
        tests:
          - not_null

      - name: current_capacity_utilization
        tests:
          - not_null
      
            - name: alternative_daily_capacity
        tests:
          - not_null

      - name: alternative_capacity_utilization
        tests:
          - not_null

      - name: capacity_utilization_improvement
        description: >
          Difference between current and alternative observed capacity
          utilization. Positive values indicate lower observed capacity
          pressure at the alternative plant.
        tests:
          - not_null