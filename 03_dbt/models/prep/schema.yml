# models/prep/schema.yml
version: 2

models:
  - name: prep_order_freight
    description: "Order-level freight rate (avg across matched brackets), excluding CRF and weight-bracket-gap orders."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer
        tests:
          - not_null

  - name: prep_order_capacity
    description: "Order-level plant capacity utilization ratio."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer
        tests:
          - not_null

  - name: prep_order_delivery
    description: "Order-level delivery deviation (net early/late days), excluding orders with contradictory ahead/late flags."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer
        tests:
          - not_null

  - name: prep_customer_kpi_base
    description: "Customer-level aggregation of the three base KPI inputs (freight rate, capacity utilization, delivery deviation)."
    columns:
      - name: customer
        tests:
          - unique
          - not_null